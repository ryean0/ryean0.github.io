# Filename: .github/workflows/deploy.yml
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Add this paths configuration:
    paths:
      - 'content/**'           # trigger on new json added/removed
      - 'src/**'               # Trigger on code changes
      - 'public/**'
      - 'package.json'
      # NEW: It is best practice to include the lockfile when using npm ci
      - 'package-lock.json'
      - 'next.config.ts'
      - 'tailwind.config.ts'   # Include tailwind config changes
      - '.github/workflows/deploy.yml'
      
  workflow_dispatch:

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      # Use npm ci for faster, reproducible installs
      - name: Install Dependencies
        run: npm ci

      # The build process will now read the filesystem via src/lib/dataLoader.ts
      - name: Build Project
        run: npm run build

      # --- CRITICAL STEP TO FIX STYLING BUG 0801---
      # This step creates the .nojekyll file in the output directory (out).
      # This tells GitHub Pages to skip Jekyll processing, allowing folders 
      # starting with underscores (like _next) to be served correctly.
      - name: Disable Jekyll
        run: touch ./out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The path now includes the .nojekyll file
          path: ./out

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4