# Filename: .github/workflows/deploy.yml
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Add this paths configuration:
    paths:
      - 'content/**'           # trigger on new json added/removed
      - 'src/**'               # Trigger on code changes
      - 'public/**'
      - 'package.json'
      - 'next.config.ts'
      - 'tailwind.config.ts'   # Include tailwind config changes
      - '.github/workflows/deploy.yml'
      
  workflow_dispatch:

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      # The build process will now read the filesystem via src/lib/dataLoader.ts
      - name: Build Project
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    # ... (rest of the deploy job remains the same)
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4